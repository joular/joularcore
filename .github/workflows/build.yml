name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: Intel Macs (macos-26-intel is the last Intel image, macOS 26 being the last macOS for Intel Macs)
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: alire-project/setup-alire@v6

      - name: Build the static library
        run: alr build

      - name: Build the relocatable (shared) library
        run: alr exec -- gprbuild -P joularcore.gpr -XJOULARCORE_LIBRARY_TYPE=relocatable -p

      - name: Build the Ada example
        run: alr exec -- gprbuild -P example/example.gpr -p

      - name: Build the C example (Linux and macOS)
        if: runner.os != 'Windows'
        run: alr exec -- make -C example/c

      - name: Build the C example (Windows)
        if: runner.os == 'Windows'
        run: |
          # make is not installed on the Windows runner, unlike gcc
          # The Makefile runs its commands in cmd, so the default PowerShell shell of the runner is fine
          choco install make --no-progress -y
          alr exec -- make -C example/c

      # Own object folder, so the objects of the library built above are not replaced
      # The Windows branch uses CPUID, which only compiles on x86; the Linux runner is x86
      - name: Compile-check the Windows branch (Linux, x86)
        if: runner.os == 'Linux'
        run: alr exec -- gprbuild -P joularcore.gpr -XPJ_OS=windows -XPJ_X86=True -f -c --subdirs=check-windows

      - name: Run the examples for a few readings
        shell: bash
        run: |
          ./example/example_joular_core 3
          ./example/c/example_c 3

      - name: Check the version in the code matches the crate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          crate=$(grep -m1 '^version' alire.toml | cut -d'"' -f2)
          code=$(grep -m1 'Version_Number' src/joular_core.adb | cut -d'"' -f2)
          echo "alire.toml=$crate joular_core.adb=$code"
          test "$crate" = "$code"

      - name: Check the PawnIO modules against the package carrying them (Linux)
        if: runner.os == 'Linux'
        # Checks the pinned SHA-256 of tools/pawnio/*.bin, then that the committed package matches what they produce
        run: python3 tools/gen_pawnio_modules.py --check

  # FreeBSD, in a virtual machine as GitHub has no FreeBSD runners
  # GNAT 15 at least: GNAT 12, which gprbuild brings along, crashes on the cpuctl code and ignores pragma Interrupts_System_By_Default
  # Nothing tells the build it is on FreeBSD: it finds out on its own, as it does for anyone building there
  # The virtual machine has no RAPL, so the examples report the CPU as not available
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gmake, as the Makefile of the C example is written for GNU make
      - name: Build and run the examples in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          prepare: pkg install -y gprbuild gnat15 gmake
          run: |
            export PATH=/usr/local/gnat15/bin:$PATH
            gprbuild -P joularcore.gpr -p
            gprbuild -P joularcore.gpr -XJOULARCORE_LIBRARY_TYPE=relocatable -p
            gprbuild -P example/example.gpr -p
            gmake -C example/c
            ./example/example_joular_core 3
            ./example/c/example_c 3
