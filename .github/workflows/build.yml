name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: alire-project/setup-alire@v6

      - name: Build the static library
        run: alr build

      - name: Build the relocatable (shared) library
        run: alr exec -- gprbuild -P joularcore.gpr -XJOULARCORE_LIBRARY_TYPE=relocatable -p

      - name: Build the Ada example
        run: alr exec -- gprbuild -P example/example.gpr -p

      - name: Build the C example (Linux and macOS)
        if: runner.os != 'Windows'
        run: alr exec -- make -C example/c

      - name: Build the C example (Windows)
        if: runner.os == 'Windows'
        run: |
          # make is not installed on the Windows runner, unlike gcc
          # The Makefile runs its commands in cmd, so the default PowerShell shell of the runner is fine
          choco install make --no-progress -y
          alr exec -- make -C example/c

      - name: Compile-check the BSD branch (Linux)
        if: runner.os == 'Linux'
        run: alr exec -- gprbuild -P joularcore.gpr -XPJ_OS=bsd -f -c

      # Windows gets the processor with CPUID, which only compiles on an x86 (not ARM) CPU
      # Linux runner here is x86, so we test that too for Windows
      - name: Compile-check the Windows branch (Linux, x86)
        if: runner.os == 'Linux'
        run: alr exec -- gprbuild -P joularcore.gpr -XPJ_OS=windows -XPJ_X86=True -f -c

      # The examples take a number of readings and stop
      - name: Run the examples for a few readings
        shell: bash
        run: |
          ./example/example_joular_core 3
          ./example/c/example_c 3

      - name: Check the version in the code matches the crate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          crate=$(grep -m1 '^version' alire.toml | cut -d'"' -f2)
          code=$(grep -m1 'Version_Number' src/joular_core.adb | cut -d'"' -f2)
          echo "alire.toml=$crate joular_core.adb=$code"
          test "$crate" = "$code"

      - name: Check the PawnIO modules against the package carrying them (Linux)
        if: runner.os == 'Linux'
        # Checks the pinned SHA-256 of tools/pawnio/*.bin, then that src/joular_core-pawnio_modules.ads is still what those modules produce, so a module and the package carrying it cannot drift apart unnoticed
        run: python3 tools/gen_pawnio_modules.py --check
